name: demo_preset_147
model_type: CNNINRSplitWindModel
scale: 1
num_gpu: 0
manual_seed: 42
datasets:
  train:
    name: INR_Train
    type: INRTrainDataset
    style_natural:
    - D:\UOM\Semester 5\Computer Vision\Project\dataset\Benchmark\Test_References\natural\a0081-kme_106.jpg
    style_output:
    - D:\UOM\Semester 5\Computer Vision\Project\dataset\Benchmark\Test_References\Presets\Preset_147\a0081-kme_106.jpg
    sample_rate: 1
    window_size: 12
    Windows_batch_size: 484
    io_backend:
      type: disk
  val:
    name: INR_Inference
    type: INRInferenceDataset
    inp_natural: D:\UOM\Semester 5\Computer Vision\Project\demo\demo_work\Preset_147\input
    io_backend:
      type: disk
    inp_gt: D:\UOM\Semester 5\Computer Vision\Project\demo\demo_work\Preset_147\ground_truth
network_g:
  type: CNNDWSplitSiren
  n_input_p: 2
  n_input_s: 3
  n_output_dims: 3
  sin_w: 1
  n_neurons: 64
  n_hidden_p: 1
  n_hidden_s: 1
  n_hidden_m: 1
  use_skip: true
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  optim_g:
    type: AdamW
    lr: 0.01
    weight_decay:
    - 0.1
    - 0.0001
    - 0.001
    betas:
    - 0.9
    - 0.9
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 1000
    eta_min: 0.0001
  total_iter: 1000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
  resume_train: false
val:
  val_freq: 10000.0
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
logger:
  print_freq: 200
  save_checkpoint: true
  use_tb_logger: false
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
